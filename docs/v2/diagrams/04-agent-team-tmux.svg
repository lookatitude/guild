<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="650" viewBox="0 0 1180 650" role="img" aria-labelledby="title desc">
  <title id="title">tmux agent-team backend</title>
  <desc id="desc">Decision and launch flow for agent-team backend with tmux panes and fallback to subagents.</desc>
  <style>
    .box{fill:#eef4ff;stroke:#315e93;stroke-width:2;rx:8}.ok{fill:#effaf2;stroke:#277545;stroke-width:2;rx:8}.warn{fill:#fff7e8;stroke:#9a6a17;stroke-width:2;rx:8}.txt{font:15px Arial,sans-serif;fill:#1f2937}.small{font:12px Arial,sans-serif;fill:#374151}.head{font:bold 17px Arial,sans-serif}.arrow{stroke:#374151;stroke-width:2;fill:none;marker-end:url(#arrow)}
  </style>
  <defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#374151"/></marker></defs>
  <rect width="1180" height="650" fill="#f7f8fb"/>
  <rect class="box" x="70" y="70" width="210" height="70"/><text class="head" x="118" y="100">Team YAML</text><text class="small" x="105" y="122">backend candidate</text>
  <rect class="warn" x="350" y="70" width="210" height="70"/><text class="head" x="395" y="100">Preflight</text><text class="small" x="378" y="122">tmux, $TMUX, env</text>
  <rect class="warn" x="630" y="70" width="210" height="70"/><text class="head" x="678" y="100">User gate</text><text class="small" x="664" y="122">explicit approval</text>
  <rect class="ok" x="910" y="70" width="210" height="70"/><text class="head" x="954" y="100">Dry run</text><text class="small" x="940" y="122">launcher preview</text>
  <path class="arrow" d="M280 105 H350"/><path class="arrow" d="M560 105 H630"/><path class="arrow" d="M840 105 H910"/>

  <rect class="ok" x="185" y="240" width="810" height="260"/><text class="head" x="510" y="275">tmux session</text>
  <rect class="box" x="230" y="320" width="150" height="85"/><text class="head" x="260" y="350">Pane 0</text><text class="small" x="252" y="374">orchestrator</text>
  <rect class="box" x="430" y="320" width="150" height="85"/><text class="head" x="460" y="350">Pane 1</text><text class="small" x="458" y="374">architect</text>
  <rect class="box" x="630" y="320" width="150" height="85"/><text class="head" x="660" y="350">Pane 2</text><text class="small" x="666" y="374">backend</text>
  <rect class="box" x="830" y="320" width="150" height="85"/><text class="head" x="860" y="350">Pane N</text><text class="small" x="870" y="374">qa/etc</text>
  <path class="arrow" d="M1015 140 C1015 215 930 240 930 240"/>
  <path class="arrow" d="M380 362 H430"/><path class="arrow" d="M580 362 H630"/><path class="arrow" d="M780 362 H830"/>

  <rect class="warn" x="70" y="530" width="360" height="70"/><text class="head" x="145" y="560">Fallback to subagents</text><text class="small" x="100" y="582">missing tmux, inside tmux, env absent, or no approval</text>
  <rect class="ok" x="705" y="530" width="360" height="70"/><text class="head" x="775" y="560">Session manifest</text><text class="small" x="755" y="582">.guild/runs/&lt;run-id&gt;/agent-team/session.json</text>
  <path class="arrow" d="M455 140 C360 235 225 430 250 530"/><path class="arrow" d="M590 500 C690 540 705 565 705 565"/>
</svg>
