<svg xmlns="http://www.w3.org/2000/svg" width="1250" height="720" viewBox="0 0 1250 720" role="img" aria-labelledby="title desc">
  <title id="title">Phase-specific Guild team composition</title>
  <desc id="desc">Flowchart showing spec domain matching, gap resolution, implied specialists, backend selection, and team YAML output.</desc>
  <style>
    .box{fill:#eef4ff;stroke:#315e93;stroke-width:2;rx:8}.choice{fill:#fff7e8;stroke:#9a6a17;stroke-width:2;rx:8}.out{fill:#effaf2;stroke:#277545;stroke-width:2;rx:8}.txt{font:15px Arial,sans-serif;fill:#1f2937}.small{font:12px Arial,sans-serif;fill:#374151}.head{font:bold 17px Arial,sans-serif}.arrow{stroke:#374151;stroke-width:2;fill:none;marker-end:url(#arrow)}
  </style>
  <defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#374151"/></marker></defs>
  <rect width="1250" height="720" fill="#f7f8fb"/>
  <rect class="box" x="60" y="70" width="190" height="70"/><text class="head" x="102" y="99">Spec domains</text><text class="small" x="91" y="121">goal, criteria, constraints</text>
  <rect class="box" x="330" y="70" width="210" height="70"/><text class="head" x="367" y="99">14 specialists</text><text class="small" x="360" y="121">agents/*.md roster</text>
  <rect class="box" x="620" y="70" width="220" height="70"/><text class="head" x="663" y="99">Match + classify</text><text class="small" x="655" y="121">covered domains or gaps</text>
  <path class="arrow" d="M250 105 H330"/><path class="arrow" d="M540 105 H620"/>

  <rect class="choice" x="80" y="220" width="230" height="120"/><text class="head" x="124" y="250">Gap choices</text><text class="small" x="105" y="275">A auto-create</text><text class="small" x="105" y="295">B skip and flag</text><text class="small" x="105" y="315">C substitute</text><text class="small" x="105" y="335">D compose manually</text>
  <rect class="choice" x="390" y="220" width="230" height="120"/><text class="head" x="438" y="250">Hard rules</text><text class="small" x="420" y="275">architect multi-component</text><text class="small" x="420" y="295">security sensitive</text><text class="small" x="420" y="315">qa with backend</text>
  <rect class="choice" x="700" y="220" width="230" height="120"/><text class="head" x="743" y="250">Backend choice</text><text class="small" x="730" y="275">tmux + env + approval</text><text class="small" x="730" y="295">agent-team if useful</text><text class="small" x="730" y="315">else subagent</text>
  <path class="arrow" d="M730 140 V220"/><path class="arrow" d="M620 275 H620"/><path class="arrow" d="M310 280 H390"/><path class="arrow" d="M620 280 H700"/>

  <rect class="box" x="1020" y="220" width="170" height="120"/><text class="head" x="1058" y="250">Capability</text><text class="small" x="1048" y="275">skills</text><text class="small" x="1048" y="295">tools</text><text class="small" x="1048" y="315">MCP servers</text><text class="small" x="1048" y="335">dependencies</text>
  <path class="arrow" d="M930 280 H1020"/>

  <rect class="out" x="315" y="450" width="630" height="130"/><text class="head" x="560" y="482">.guild/team/&lt;slug&gt;.yaml</text><text class="small" x="340" y="512">phase entries with backend, specialists, scope, skills, tools, mcp_servers, depends-on</text><text class="small" x="355" y="535">gaps_resolved and coverage_flags remain visible for review</text><text class="small" x="355" y="558">later phases read this file; no hidden reselection</text>
  <path class="arrow" d="M195 340 C240 430 315 475 315 515"/><path class="arrow" d="M505 340 V450"/><path class="arrow" d="M815 340 C780 405 745 440 715 450"/><path class="arrow" d="M1105 340 C1050 430 945 482 945 515"/>

  <text class="txt" x="145" y="655">Advisory default: smallest team that covers the spec, narrow ownership, explicit reviewer lanes instead of broad shared write scope.</text>
</svg>
