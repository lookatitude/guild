<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="760" viewBox="0 0 1320 760" role="img" aria-labelledby="title desc">
  <title id="title">Guild phase-specific team composition</title>
  <desc id="desc">Flowchart showing each phase composing a tailored team with producer roles, advisory memory agents, reviewers, tools, MCP servers, and backend selection.</desc>
  <style>
    .box{fill:#eef4ff;stroke:#315e93;stroke-width:2;rx:8}.choice{fill:#fff7e8;stroke:#9a6a17;stroke-width:2;rx:8}.out{fill:#effaf2;stroke:#277545;stroke-width:2;rx:8}.txt{font:15px Arial,sans-serif;fill:#1f2937}.small{font:12px Arial,sans-serif;fill:#374151}.head{font:bold 17px Arial,sans-serif}.arrow{stroke:#374151;stroke-width:2;fill:none;marker-end:url(#arrow)}
  </style>
  <defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#374151"/></marker></defs>
  <rect width="1320" height="760" fill="#f7f8fb"/>
  <rect class="box" x="60" y="70" width="190" height="75"/><text class="head" x="108" y="100">Entrypoint</text><text class="small" x="92" y="122">init / ideation / plan / dev / quality / ops</text>
  <rect class="box" x="320" y="70" width="190" height="75"/><text class="head" x="360" y="100">Phase goal</text><text class="small" x="348" y="122">artifact + done criteria</text>
  <rect class="box" x="580" y="70" width="190" height="75"/><text class="head" x="622" y="100">Role match</text><text class="small" x="612" y="122">14 specialists + gaps</text>
  <rect class="choice" x="840" y="70" width="190" height="75"/><text class="head" x="872" y="100">Backend</text><text class="small" x="870" y="122">tmux team or subagent</text>
  <path class="arrow" d="M250 108 H320"/><path class="arrow" d="M510 108 H580"/><path class="arrow" d="M770 108 H840"/>

  <rect class="box" x="80" y="235" width="220" height="112"/><text class="head" x="128" y="266">Producer team</text><text class="small" x="110" y="290">phase-specific owners</text><text class="small" x="110" y="312">no developers in planning</text><text class="small" x="110" y="334">unless needed</text>
  <rect class="box" x="385" y="235" width="220" height="112"/><text class="head" x="430" y="266">Advisory agents</text><text class="small" x="420" y="290">read memory/research</text><text class="small" x="420" y="312">help producers get unstuck</text><text class="small" x="420" y="334">read-only by default</text>
  <rect class="choice" x="690" y="235" width="220" height="112"/><text class="head" x="732" y="266">Review agents</text><text class="small" x="720" y="290">cross-model adversary</text><text class="small" x="720" y="312">QA/security/architect</text><text class="small" x="720" y="334">as phase requires</text>
  <rect class="box" x="995" y="235" width="220" height="112"/><text class="head" x="1042" y="266">Capabilities</text><text class="small" x="1030" y="290">skills, tools, MCP</text><text class="small" x="1030" y="312">network/browser/write</text><text class="small" x="1030" y="334">least privilege</text>
  <path class="arrow" d="M935 145 C850 205 765 218 690 235"/><path class="arrow" d="M935 145 C1030 205 1090 218 1105 235"/><path class="arrow" d="M675 145 C585 205 515 218 495 235"/><path class="arrow" d="M415 145 C310 205 225 218 190 235"/>

  <rect class="out" x="260" y="480" width="800" height="135"/><text class="head" x="560" y="512">.guild/team/&lt;phase-slug&gt;.yaml</text><text class="small" x="315" y="542">phase, backend, producer specialists, advisory agents, reviewers, tools, mcp_servers, dependencies, autonomy gates</text><text class="small" x="315" y="568">development and quality teams are autonomous inside approved criteria; init and ideation stay interactive</text><text class="small" x="315" y="594">each phase composes its own team; prior phase teams are inputs, not defaults</text>
  <path class="arrow" d="M190 347 C250 430 315 470 335 480"/><path class="arrow" d="M495 347 V480"/><path class="arrow" d="M800 347 C770 425 720 460 690 480"/><path class="arrow" d="M1105 347 C1015 430 990 460 985 480"/>
  <text class="txt" x="170" y="690">Advisory default: every producer/reviewer gets memory assistance unless no durable memory exists yet. Missing prerequisites route to the earlier phase that can produce them.</text>
</svg>
