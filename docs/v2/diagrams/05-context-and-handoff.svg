<svg xmlns="http://www.w3.org/2000/svg" width="1250" height="650" viewBox="0 0 1250 650" role="img" aria-labelledby="title desc">
  <title id="title">Context assembly and handoff flow</title>
  <desc id="desc">Diagram showing universal, role, and task context layers becoming bundles, dispatches, receipts, review, and verification.</desc>
  <style>
    .box{fill:#eef4ff;stroke:#315e93;stroke-width:2;rx:8}.state{fill:#effaf2;stroke:#277545;stroke-width:2;rx:8}.warn{fill:#fff7e8;stroke:#9a6a17;stroke-width:2;rx:8}.txt{font:15px Arial,sans-serif;fill:#1f2937}.small{font:12px Arial,sans-serif;fill:#374151}.head{font:bold 17px Arial,sans-serif}.arrow{stroke:#374151;stroke-width:2;fill:none;marker-end:url(#arrow)}
  </style>
  <defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#374151"/></marker></defs>
  <rect width="1250" height="650" fill="#f7f8fb"/>
  <rect class="box" x="70" y="80" width="220" height="75"/><text class="head" x="125" y="110">Universal</text><text class="small" x="102" y="132">principles, overview, goals</text>
  <rect class="box" x="70" y="210" width="220" height="75"/><text class="head" x="142" y="240">Role</text><text class="small" x="98" y="262">standards, entities, products</text>
  <rect class="box" x="70" y="340" width="220" height="75"/><text class="head" x="142" y="370">Task</text><text class="small" x="96" y="392">lane, refs, upstream contracts</text>
  <rect class="state" x="390" y="190" width="230" height="110"/><text class="head" x="435" y="225">Context bundle</text><text class="small" x="425" y="250">target 3k tokens</text><text class="small" x="425" y="272">hard cap 6k tokens</text>
  <path class="arrow" d="M290 118 C340 130 360 195 390 220"/><path class="arrow" d="M290 247 H390"/><path class="arrow" d="M290 378 C340 365 360 300 390 275"/>

  <rect class="warn" x="730" y="190" width="210" height="110"/><text class="head" x="780" y="225">Dispatch</text><text class="small" x="760" y="250">subagent or agent-team</text><text class="small" x="765" y="272">bundle path first</text>
  <path class="arrow" d="M620 245 H730"/>
  <rect class="state" x="1010" y="190" width="200" height="110"/><text class="head" x="1052" y="225">Receipt</text><text class="small" x="1030" y="250">scope, files, evidence</text><text class="small" x="1030" y="272">assumptions, risks</text>
  <path class="arrow" d="M940 245 H1010"/>

  <rect class="state" x="390" y="450" width="230" height="75"/><text class="head" x="440" y="480">Assumptions</text><text class="small" x="420" y="502">aggregated per run</text>
  <rect class="state" x="730" y="450" width="210" height="75"/><text class="head" x="783" y="480">Review</text><text class="small" x="760" y="502">receipt-driven</text>
  <rect class="state" x="1010" y="450" width="200" height="75"/><text class="head" x="1056" y="480">Verify</text><text class="small" x="1036" y="502">criteria to evidence</text>
  <path class="arrow" d="M1110 300 V450"/><path class="arrow" d="M1010 488 H940"/><path class="arrow" d="M730 488 H620"/><path class="arrow" d="M620 488 H730"/><path class="arrow" d="M940 488 H1010"/>
</svg>
