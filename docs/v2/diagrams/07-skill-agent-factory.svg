<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="720" viewBox="0 0 1320 720" role="img" aria-labelledby="title desc">
  <title id="title">Guild skill and agent factory</title>
  <desc id="desc">Flowchart for creating concise skills and proposed agents with boundary scans, eval gates, shadow mode, and registration.</desc>
  <style>
    .box{fill:#eef4ff;stroke:#315e93;stroke-width:2;rx:8}.gate{fill:#fff7e8;stroke:#9a6a17;stroke-width:2;rx:8}.ok{fill:#effaf2;stroke:#277545;stroke-width:2;rx:8}.bad{fill:#ffecec;stroke:#a33a3a;stroke-width:2;rx:8}.txt{font:15px Arial,sans-serif;fill:#1f2937}.small{font:12px Arial,sans-serif;fill:#374151}.head{font:bold 17px Arial,sans-serif}.arrow{stroke:#374151;stroke-width:2;fill:none;marker-end:url(#arrow)}
  </style>
  <defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#374151"/></marker></defs>
  <rect width="1320" height="720" fill="#f7f8fb"/>
  <rect class="box" x="60" y="70" width="190" height="70"/><text class="head" x="102" y="100">Evidence</text><text class="small" x="90" y="122">reflections + gaps</text>
  <rect class="gate" x="310" y="70" width="210" height="70"/><text class="head" x="350" y="100">Skill or agent?</text><text class="small" x="338" y="122">boundary decision</text>
  <path class="arrow" d="M250 105 H310"/>

  <rect class="box" x="120" y="230" width="230" height="90"/><text class="head" x="170" y="260">Skill path</text><text class="small" x="150" y="284">short playbook</text><text class="small" x="150" y="304">paired eval + shadow</text>
  <rect class="box" x="470" y="230" width="230" height="90"/><text class="head" x="520" y="260">Agent path</text><text class="small" x="500" y="284">interview + persona</text><text class="small" x="500" y="304">2-5 concise skills</text>
  <path class="arrow" d="M390 140 C330 185 260 210 235 230"/><path class="arrow" d="M440 140 C505 185 560 210 585 230"/>

  <rect class="gate" x="820" y="145" width="230" height="100"/><text class="head" x="860" y="178">Extraction gates</text><text class="small" x="850" y="202">3 runs, boundary, context,</text><text class="small" x="875" y="222">reflections, evals</text>
  <path class="arrow" d="M700 275 C765 250 800 205 820 195"/>
  <rect class="gate" x="820" y="300" width="230" height="100"/><text class="head" x="865" y="333">Boundary scan</text><text class="small" x="850" y="357">adjacent DO NOT TRIGGER</text><text class="small" x="878" y="377">paired evals</text>
  <path class="arrow" d="M935 245 V300"/>
  <rect class="gate" x="820" y="455" width="230" height="100"/><text class="head" x="875" y="488">Shadow mode</text><text class="small" x="850" y="512">historical tasks, collisions,</text><text class="small" x="890" y="532">token deltas</text>
  <path class="arrow" d="M935 400 V455"/>

  <rect class="ok" x="1110" y="455" width="160" height="100"/><text class="head" x="1147" y="488">Register</text><text class="small" x="1130" y="512">live agent/skills</text><text class="small" x="1130" y="532">restart needed</text>
  <rect class="bad" x="560" y="455" width="190" height="100"/><text class="head" x="608" y="488">Reject</text><text class="small" x="590" y="512">archive evidence</text><text class="small" x="590" y="532">refinement options</text>
  <path class="arrow" d="M1050 505 H1110"/><path class="arrow" d="M820 505 H750"/>

  <rect class="ok" x="120" y="455" width="230" height="100"/><text class="head" x="170" y="488">Promote skill</text><text class="small" x="150" y="512">description optimize</text><text class="small" x="150" y="532">versioned rollback</text>
  <path class="arrow" d="M235 320 V455"/>
</svg>
