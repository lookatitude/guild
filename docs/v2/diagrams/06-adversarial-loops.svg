<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="720" viewBox="0 0 1320 720" role="img" aria-labelledby="title desc">
  <title id="title">Guild adversarial loops</title>
  <desc id="desc">Diagram of producer challenger loops, sentinel termination, cap escalation, Codex gates, and security restart.</desc>
  <style>
    .box{fill:#eef4ff;stroke:#315e93;stroke-width:2;rx:8}.gate{fill:#fff7e8;stroke:#9a6a17;stroke-width:2;rx:8}.ok{fill:#effaf2;stroke:#277545;stroke-width:2;rx:8}.bad{fill:#ffecec;stroke:#a33a3a;stroke-width:2;rx:8}.txt{font:15px Arial,sans-serif;fill:#1f2937}.small{font:12px Arial,sans-serif;fill:#374151}.head{font:bold 17px Arial,sans-serif}.arrow{stroke:#374151;stroke-width:2;fill:none;marker-end:url(#arrow)}
  </style>
  <defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#374151"/></marker></defs>
  <rect width="1320" height="720" fill="#f7f8fb"/>
  <rect class="box" x="80" y="70" width="220" height="75"/><text class="head" x="133" y="102">Producer</text><text class="small" x="115" y="124">architect or lane owner</text>
  <rect class="gate" x="410" y="70" width="220" height="75"/><text class="head" x="463" y="102">Challenger</text><text class="small" x="438" y="124">researcher, security, qa</text>
  <rect class="gate" x="740" y="70" width="220" height="75"/><text class="head" x="795" y="102">Sentinel</text><text class="small" x="765" y="124">## NO MORE QUESTIONS</text>
  <rect class="ok" x="1070" y="70" width="190" height="75"/><text class="head" x="1120" y="102">Advance</text><text class="small" x="1098" y="124">next phase or lane</text>
  <path class="arrow" d="M300 108 H410"/><path class="arrow" d="M630 108 H740"/><path class="arrow" d="M960 108 H1070"/>

  <rect class="bad" x="410" y="230" width="220" height="90"/><text class="head" x="452" y="262">More questions</text><text class="small" x="450" y="286">or malformed sentinel</text><text class="small" x="452" y="306">continue round</text>
  <path class="arrow" d="M520 145 V230"/><path class="arrow" d="M410 275 C275 275 190 200 190 145"/>

  <rect class="bad" x="740" y="230" width="220" height="90"/><text class="head" x="790" y="262">Cap hit</text><text class="small" x="775" y="286">force-pass, extend-cap,</text><text class="small" x="805" y="306">or rework</text>
  <path class="arrow" d="M630 275 H740"/>

  <rect class="bad" x="80" y="430" width="280" height="105"/><text class="head" x="125" y="462">Security restart</text><text class="small" x="110" y="486">severity high and not addressed</text><text class="small" x="110" y="508">restart lane from L3</text>
  <rect class="gate" x="450" y="430" width="280" height="105"/><text class="head" x="500" y="462">Phase gates</text><text class="small" x="480" y="486">G-init, G-ideation, G-planning,</text><text class="small" x="470" y="508">G-development, G-quality, G-operations</text>
  <rect class="ok" x="820" y="430" width="280" height="105"/><text class="head" x="888" y="462">Review trail</text><text class="small" x="852" y="486">handoffs, loop summary,</text><text class="small" x="880" y="508">JSONL and Codex trail</text>
  <path class="arrow" d="M850 320 C760 385 660 415 590 430"/><path class="arrow" d="M360 482 H450"/><path class="arrow" d="M730 482 H820"/>

  <text class="txt" x="110" y="635">A clean review means no blocking or advisory findings remain in the artifact, not merely that chat acknowledged them.</text>
</svg>
