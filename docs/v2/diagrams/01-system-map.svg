<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Guild v2 system component map</title>
  <desc id="desc">A layered architecture diagram showing user, orchestrator, meta skills, specialists, runtime state, hooks, telemetry, and evolution.</desc>
  <style>
    .bg{fill:#f7f8fb}.band{fill:#ffffff;stroke:#c8ced8;stroke-width:2}.box{fill:#eef4ff;stroke:#37639b;stroke-width:2;rx:8}.state{fill:#f2fbf5;stroke:#2e7a4f;stroke-width:2;rx:8}.warn{fill:#fff7e8;stroke:#9a6a17;stroke-width:2;rx:8}.txt{font:16px Arial,sans-serif;fill:#1f2937}.small{font:13px Arial,sans-serif;fill:#374151}.head{font:bold 18px Arial,sans-serif;fill:#111827}.arrow{stroke:#374151;stroke-width:2;fill:none;marker-end:url(#arrow)}
  </style>
  <defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#374151"/></marker></defs>
  <rect class="bg" width="1200" height="760"/>
  <rect class="band" x="40" y="35" width="1120" height="115" rx="10"/>
  <text class="head" x="60" y="68">User and Orchestrator</text>
  <rect class="box" x="80" y="88" width="210" height="42"/><text class="txt" x="114" y="115">User brief / gates</text>
  <rect class="box" x="400" y="88" width="290" height="42"/><text class="txt" x="438" y="115">/guild orchestrator session</text>
  <rect class="warn" x="800" y="88" width="280" height="42"/><text class="txt" x="828" y="115">Adversarial review policy</text>
  <path class="arrow" d="M290 109 H400"/><path class="arrow" d="M690 109 H800"/>

  <rect class="band" x="40" y="180" width="1120" height="160" rx="10"/>
  <text class="head" x="60" y="214">Plugin Runtime Surface</text>
  <rect class="box" x="80" y="238" width="180" height="60"/><text class="txt" x="117" y="264">Commands</text><text class="small" x="105" y="286">commands/*.md</text>
  <rect class="box" x="310" y="238" width="220" height="60"/><text class="txt" x="366" y="264">Meta skills</text><text class="small" x="338" y="286">skills/meta/*</text>
  <rect class="box" x="580" y="238" width="210" height="60"/><text class="txt" x="622" y="264">Specialists</text><text class="small" x="602" y="286">agents + advisory agents</text>
  <rect class="box" x="840" y="238" width="220" height="60"/><text class="txt" x="894" y="264">Hooks/scripts</text><text class="small" x="880" y="286">hooks + scripts</text>
  <path class="arrow" d="M545 130 V238"/>
  <path class="arrow" d="M260 268 H310"/><path class="arrow" d="M530 268 H580"/><path class="arrow" d="M790 268 H840"/>

  <rect class="band" x="40" y="370" width="1120" height="170" rx="10"/>
  <text class="head" x="60" y="404">Execution and Runtime State</text>
  <rect class="state" x="80" y="428" width="210" height="70"/><text class="txt" x="129" y="454">Spec/team/plan</text><text class="small" x="108" y="478">.guild/spec team plan</text>
  <rect class="state" x="340" y="428" width="210" height="70"/><text class="txt" x="377" y="454">Context bundles</text><text class="small" x="375" y="478">.guild/context</text>
  <rect class="state" x="600" y="428" width="210" height="70"/><text class="txt" x="646" y="454">Lane receipts</text><text class="small" x="640" y="478">.guild/runs</text>
  <rect class="warn" x="860" y="428" width="220" height="70"/><text class="txt" x="916" y="454">Backend</text><text class="small" x="884" y="478">subagent or tmux team</text>
  <path class="arrow" d="M420 298 V428"/><path class="arrow" d="M290 463 H340"/><path class="arrow" d="M550 463 H600"/><path class="arrow" d="M810 463 H860"/>

  <rect class="band" x="40" y="570" width="1120" height="145" rx="10"/>
  <text class="head" x="60" y="604">Knowledge, Review, and Evolution</text>
  <rect class="state" x="90" y="628" width="210" height="52"/><text class="txt" x="116" y="660">.guild/wiki + raw</text>
  <rect class="warn" x="355" y="628" width="210" height="52"/><text class="txt" x="403" y="660">Codex gates</text>
  <rect class="state" x="620" y="628" width="210" height="52"/><text class="txt" x="652" y="660">Review / verify</text>
  <rect class="state" x="885" y="628" width="210" height="52"/><text class="txt" x="928" y="660">Evolution loop</text>
  <path class="arrow" d="M705 498 V628"/><path class="arrow" d="M830 654 H885"/><path class="arrow" d="M620 654 H565"/><path class="arrow" d="M355 654 H300"/>
</svg>
