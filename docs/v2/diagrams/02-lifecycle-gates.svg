<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="760" viewBox="0 0 1500 760" role="img" aria-labelledby="title desc">
  <title id="title">Guild v2 phase lifecycle and gates</title>
  <desc id="desc">Phase-entrypoint flow from init through ideation, planning, development, optional quality, and operations, with memory, advisory agents, and adversarial review at every phase.</desc>
  <style>
    .phase{fill:#eef4ff;stroke:#315e93;stroke-width:2;rx:8}.gate{fill:#fff7e8;stroke:#9a6a17;stroke-width:2;rx:8}.state{fill:#effaf2;stroke:#277545;stroke-width:2;rx:8}.txt{font:15px Arial,sans-serif;fill:#1f2937}.small{font:12px Arial,sans-serif;fill:#374151}.head{font:bold 16px Arial,sans-serif;fill:#111827}.arrow{stroke:#374151;stroke-width:2;fill:none;marker-end:url(#arrow)}
  </style>
  <defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#374151"/></marker></defs>
  <rect width="1500" height="760" fill="#f7f8fb"/>
  <text class="head" x="55" y="42">Each phase can be the entrypoint</text>
  <rect class="phase" x="55" y="75" width="160" height="72"/><text class="head" x="116" y="104">Init</text><text class="small" x="82" y="126">wiki + product context</text>
  <rect class="phase" x="265" y="75" width="160" height="72"/><text class="head" x="314" y="104">Ideation</text><text class="small" x="296" y="126">questions + debate</text>
  <rect class="phase" x="475" y="75" width="160" height="72"/><text class="head" x="516" y="104">Planning</text><text class="small" x="503" y="126">PRD + task plan</text>
  <rect class="phase" x="685" y="75" width="175" height="72"/><text class="head" x="724" y="104">Development</text><text class="small" x="716" y="126">autonomous tasks</text>
  <rect class="phase" x="910" y="75" width="160" height="72"/><text class="head" x="955" y="104">Quality</text><text class="small" x="942" y="126">optional E2E</text>
  <rect class="phase" x="1120" y="75" width="170" height="72"/><text class="head" x="1164" y="104">Operations</text><text class="small" x="1150" y="126">release/runbooks</text>
  <path class="arrow" d="M215 111 H265"/><path class="arrow" d="M425 111 H475"/><path class="arrow" d="M635 111 H685"/><path class="arrow" d="M860 111 H910"/><path class="arrow" d="M1070 111 H1120"/>

  <text class="head" x="55" y="220">Repeated phase control pattern</text>
  <rect class="state" x="75" y="250" width="180" height="70"/><text class="head" x="116" y="278">Memory</text><text class="small" x="100" y="300">wiki/raw/repo/prior artifacts</text>
  <rect class="state" x="315" y="250" width="180" height="70"/><text class="head" x="356" y="278">Team</text><text class="small" x="342" y="300">phase-specific roles</text>
  <rect class="state" x="555" y="250" width="190" height="70"/><text class="head" x="594" y="278">Advisors</text><text class="small" x="585" y="300">read-only memory help</text>
  <rect class="state" x="805" y="250" width="180" height="70"/><text class="head" x="858" y="278">Produce</text><text class="small" x="838" y="300">artifact or task output</text>
  <rect class="gate" x="1045" y="250" width="200" height="70"/><text class="head" x="1077" y="278">Adversarial</text><text class="small" x="1075" y="300">cross-model preferred</text>
  <rect class="state" x="1305" y="250" width="150" height="70"/><text class="head" x="1340" y="278">Handoff</text><text class="small" x="1330" y="300">done evidence</text>
  <path class="arrow" d="M255 285 H315"/><path class="arrow" d="M495 285 H555"/><path class="arrow" d="M745 285 H805"/><path class="arrow" d="M985 285 H1045"/><path class="arrow" d="M1245 285 H1305"/>

  <text class="head" x="55" y="400">Primary outputs</text>
  <rect class="state" x="55" y="430" width="180" height="70"/><text class="head" x="93" y="458">Init report</text><text class="small" x="86" y="480">.guild/wiki + raw</text>
  <rect class="state" x="275" y="430" width="180" height="70"/><text class="head" x="322" y="458">Idea spec</text><text class="small" x="305" y="480">.guild/spec</text>
  <rect class="state" x="495" y="430" width="200" height="70"/><text class="head" x="548" y="458">PRD/tasks</text><text class="small" x="530" y="480">.guild/prd + plan</text>
  <rect class="state" x="735" y="430" width="210" height="70"/><text class="head" x="790" y="458">Built tasks</text><text class="small" x="765" y="480">receipts + code/artifacts</text>
  <rect class="state" x="985" y="430" width="180" height="70"/><text class="head" x="1022" y="458">Quality report</text><text class="small" x="1025" y="480">.guild/quality</text>
  <rect class="state" x="1205" y="430" width="190" height="70"/><text class="head" x="1250" y="458">Ops record</text><text class="small" x="1238" y="480">.guild/ops + runbooks</text>
  <path class="arrow" d="M135 147 V430"/><path class="arrow" d="M345 147 V430"/><path class="arrow" d="M555 147 V430"/><path class="arrow" d="M772 147 V430"/><path class="arrow" d="M990 147 V430"/><path class="arrow" d="M1205 147 V430"/>

  <text class="txt" x="70" y="610">Interaction model: init and ideation are deliberately interactive; planning is interactive at approval gates; development, quality, and operations are autonomous inside the approved contract.</text>
  <text class="txt" x="70" y="642">Review model: every phase loops until findings are resolved, explicitly assumed, force-passed by the user, or routed back to an earlier phase.</text>
</svg>
