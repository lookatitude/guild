<svg xmlns="http://www.w3.org/2000/svg" width="1220" height="670" viewBox="0 0 1220 670" role="img" aria-labelledby="title desc">
  <title id="title">Tool and MCP routing</title>
  <desc id="desc">Diagram showing capability requests flowing from spec to team YAML, context bundles, lane execution, and escalation.</desc>
  <style>
    .box{fill:#eef4ff;stroke:#315e93;stroke-width:2;rx:8}.gate{fill:#fff7e8;stroke:#9a6a17;stroke-width:2;rx:8}.ok{fill:#effaf2;stroke:#277545;stroke-width:2;rx:8}.txt{font:15px Arial,sans-serif;fill:#1f2937}.small{font:12px Arial,sans-serif;fill:#374151}.head{font:bold 17px Arial,sans-serif}.arrow{stroke:#374151;stroke-width:2;fill:none;marker-end:url(#arrow)}
  </style>
  <defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#374151"/></marker></defs>
  <rect width="1220" height="670" fill="#f7f8fb"/>
  <rect class="box" x="70" y="75" width="210" height="80"/><text class="head" x="120" y="108">Spec needs</text><text class="small" x="100" y="132">repo, browser, network,</text><text class="small" x="125" y="150">external service</text>
  <rect class="gate" x="360" y="75" width="220" height="80"/><text class="head" x="420" y="108">Policy check</text><text class="small" x="395" y="132">least privilege + autonomy</text>
  <rect class="ok" x="660" y="75" width="220" height="80"/><text class="head" x="710" y="108">Team YAML</text><text class="small" x="690" y="132">tools + mcp_servers</text>
  <rect class="ok" x="960" y="75" width="190" height="80"/><text class="head" x="1000" y="108">Context</text><text class="small" x="990" y="132">repeat capability list</text>
  <path class="arrow" d="M280 115 H360"/><path class="arrow" d="M580 115 H660"/><path class="arrow" d="M880 115 H960"/>

  <rect class="box" x="85" y="270" width="190" height="90"/><text class="head" x="130" y="302">Read tools</text><text class="small" x="115" y="326">Read Grep Glob</text>
  <rect class="box" x="325" y="270" width="190" height="90"/><text class="head" x="365" y="302">Write tools</text><text class="small" x="352" y="326">Edit Write Bash</text>
  <rect class="box" x="565" y="270" width="190" height="90"/><text class="head" x="610" y="302">UI tools</text><text class="small" x="606" y="326">Browser screenshots</text>
  <rect class="box" x="805" y="270" width="190" height="90"/><text class="head" x="845" y="302">MCP</text><text class="small" x="835" y="326">memory telemetry</text>
  <path class="arrow" d="M1055 155 C980 235 930 255 900 270"/><path class="arrow" d="M1055 155 C800 235 670 250 660 270"/><path class="arrow" d="M1055 155 C600 235 440 250 420 270"/><path class="arrow" d="M1055 155 C400 235 200 250 180 270"/>

  <rect class="gate" x="285" y="485" width="280" height="95"/><text class="head" x="340" y="518">Escalation</text><text class="small" x="320" y="542">new write, network, secrets,</text><text class="small" x="360" y="562">or external service</text>
  <rect class="ok" x="685" y="485" width="280" height="95"/><text class="head" x="755" y="518">Receipt evidence</text><text class="small" x="720" y="542">what capability was used</text><text class="small" x="725" y="562">and why it was allowed</text>
  <path class="arrow" d="M420 360 V485"/><path class="arrow" d="M900 360 C870 430 840 455 825 485"/><path class="arrow" d="M565 532 H685"/>
</svg>
