<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Guild docs have moved — guildstack.dev</title>
<meta name="robots" content="noindex">
<link rel="canonical" href="https://guildstack.dev/docs">
<!-- Redirect after a short delay so the reader can see where they are going. -->
<meta http-equiv="refresh" content="3; url=https://guildstack.dev/docs">
<style>
  :root { color-scheme: light dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh;
    display: flex; align-items: center; justify-content: center;
    padding: 2rem;
    font: 16px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: #fff; color: #1a1a1a;
  }
  main { max-width: 34rem; text-align: center; }
  img { width: 96px; height: 96px; margin-bottom: 1.5rem; }
  h1 { font-size: 1.5rem; line-height: 1.3; margin: 0 0 .75rem; }
  p { margin: 0 0 1.5rem; color: #555; }
  .btn {
    display: inline-block; padding: .75rem 1.5rem;
    background: #1a1a1a; color: #fff; text-decoration: none;
    border-radius: 6px; font-weight: 600;
  }
  .btn:hover { background: #333; }
  .note { margin-top: 2rem; font-size: .875rem; color: #777; }
  .note code { background: rgba(127,127,127,.15); padding: .1rem .35rem; border-radius: 3px; }
  @media (prefers-color-scheme: dark) {
    body { background: #111; color: #eee; }
    p { color: #aaa; }
    .btn { background: #eee; color: #111; }
    .btn:hover { background: #ccc; }
    .note { color: #888; }
  }
</style>
</head>
<body>
<main>
  <img src="assets/guild-logo.svg" alt="Guild logo">
  <h1>The Guild docs live at guildstack.dev</h1>
  <p>
    This folder no longer holds documentation. The public docs are published at
    <strong>guildstack.dev/docs</strong>. Redirecting you there now&hellip;
  </p>
  <p><a class="btn" href="https://guildstack.dev/docs">Go to the docs &rarr;</a></p>
  <p class="note">
    Looking for something in this repo instead? See <code>README.md</code>,
    <code>CONTRIBUTING.md</code>, or <code>CHANGELOG.md</code>.
  </p>
</main>
</body>
</html>
