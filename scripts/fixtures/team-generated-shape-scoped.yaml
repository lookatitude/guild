spec: .guild/spec/gen-slug.md
backend: agent-team
allow_larger: false
user_approved_agent_team: true
specialists:
  - name: architect
    scope: "System boundaries and component split."
    depends-on: []
    default_tier: powerful
    capability_scope:
      - "Read"
      - "Glob"
      - "Grep"
  - name: backend
    scope: "REST contract and data layer."
    depends-on: [architect]
    default_tier: mid
    capability_scope:
      - "Read"
      - "Write"
      - "Edit"
      - "Bash"
  - name: qa
    scope: "Property-based tests and regression suite."
    depends-on: [backend]
    default_tier: cheap
