# rearch-rails.yml — architecture enforcement rails (plugin re-architecture, W1-W7).
#
# Runs the 10 self-policing rails in tests/rearch/run-all.ts on every PR/push so the
# re-architecture's invariants are GATED, not just checklisted:
#   STRICT (block):  R-DUP (no duplication), R-DEP (inward layering law), R-DIST (hooks dist-sync
#                    + import canonicality), R-HOST (add-a-host = registry row, zero core),
#                    R-SEC (security controls are code + hostile-tested), R-TRACE (trace schemas),
#                    R-DECL (declarative surface_manifest mirrors prose).
#   ADVISORY (report): R-PERF (perf budgets — timing-variance-prone in CI), R-VAC (anti-vacuity
#                    backlog), R-REACH (script/lib reachability — advisory until one clean cycle,
#                    see tests/rearch/r-reach.ts's GRADUATION note).
# A non-zero exit means a STRICT rail is RED — the architecture invariant it guards was broken.
#
# `--prove` first asserts every rail is non-vacuous (a rail that cannot fail is worthless), then the
# real run gates the tree.

name: architecture rails

on:
  pull_request:
  push:
    branches: ["**"]

jobs:
  rearch-rails:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install scripts/ dependencies (rail modules import scripts/lib)
        run: |
          if [ -f scripts/package.json ]; then
            cd scripts && npm ci --prefer-offline 2>/dev/null || npm install --prefer-offline
          fi

      - name: Install tests/ dependencies (tsx + the rail runner)
        run: |
          if [ -f tests/package.json ]; then
            cd tests && npm ci --prefer-offline 2>/dev/null || npm install --prefer-offline
          fi

      - name: Install hooks/ dependencies (R-DIST rebuilds the hook bundles)
        run: |
          if [ -f hooks/package.json ]; then
            cd hooks && npm ci --prefer-offline 2>/dev/null || npm install --prefer-offline
          fi

      - name: Prove rails are non-vacuous (a rail that cannot fail is worthless)
        run: |
          cd tests && npx tsx rearch/run-all.ts --prove

      - name: Run architecture rails (STRICT rails gate; advisory rails report)
        run: |
          cd tests && npx tsx rearch/run-all.ts

      # Inventory drift gate (xhrd-wi-02 / cross-host-release-distribution G2).
      #
      # guild.inventory.json is a COMMITTED release artifact — the release cut regenerates it
      # (AGENTS.md release step 1a) and every dist/ host package renders from it. But nothing
      # verified the committed copy still matched the source tree, so it drifted silently:
      # `next` shipped an inventory missing lib/emit-remote-orphan.ts (added by PR #88) and CI
      # stayed green. `build-inventory.ts --check` already existed to catch exactly this and
      # was wired nowhere.
      #
      # ORDERING IS LOAD-BEARING — this step MUST precede the install-channel gate below.
      # build-host-packages.ts's loadInventory() REBUILDS the inventory and WRITES it to
      # guild.inventory.json as a side effect (see its docstring: "persisted ... so the on-disk
      # artifact stays in sync"). Running this check afterwards would compare the file against
      # the render that just overwrote it and pass vacuously, gating nothing. Keep it here.
      - name: Inventory drift gate — committed guild.inventory.json matches the source tree
        run: |
          cd scripts && npm run check:inventory -- --root ..

      # Dual-home mirror-sync gate (gap-audit C5).
      #
      # Several contract files are DUAL-HOMED: the live path (e.g. scripts/lib/core/contracts/
      # specialist-identity.ts, scripts/lib/host-capabilities-schema.ts, src/modules/dispatch/
      # workflows/execution-transport-ports.ts) is the source of truth, and each module's
      # src/modules/<module>/resources/** carries a byte-identical mirror recorded in that
      # module's resources/module-resources.json with a sha256 per entry. A hand-edit to only
      # one home silently reverts the next time the mirror is re-synced.
      #
      # `sync-module-resources.ts --check` (npm check:module-resources) already diffed every
      # mirrored pair against its recorded sha256, and check-module-ownership.ts already proved
      # every inventory item is owned by exactly one module manifest — but NEITHER was wired
      # into any workflow or git hook, so the dual-home hazard the audit flagged was ungated.
      # (The sibling legs of check:module-source-of-truth — check:live-resources and
      # check:claude-install — are already gated by verify:host-packages below.)
      #
      # Read-only: --check never writes, so this cannot perturb the steps that follow.
      - name: Dual-home mirror-sync gate (src/modules/**/resources mirrors match their live sources)
        run: |
          cd scripts && npm run check:modules -- --root .. && npm run check:module-resources -- --root ..

      # Path-containment rail (task #28).
      #
      # ONE containment shape — "prove this write lands inside that root, and keep it true
      # across the mkdir" — was independently rediscovered FOUR times by lanes that did not
      # know about each other, and before the shared primitive existed it lived in eight
      # places (six of which climbed with `existsSync`, so six carried the same
      # dangling-symlink hole). Fixing any one of them would have left five.
      #
      # This rail is a TypeScript AST scan of src/**, scripts/**, hooks/** AND every
      # resources/ mirror, joined against a registry. It fails when a NEW containment home
      # appears unregistered, when a registered site drops the primitive, when a registered
      # site RE-GROWS a private climb while keeping the import, or when a resources mirror
      # of an unregistered file surfaces — the last being how the S3 lane's second mirror
      # escaped every gate and showed up in `git status` instead.
      #
      # Read-only.
      - name: Path-containment rail (no unregistered home for the containment primitive)
        run: |
          cd scripts && npm run check:path-containment -- --root ..

      # Install-channel flip (G7) — the generated tree is now the AUTHORITATIVE install surface.
      # Enforces SC-2 full-tree equivalence + SC-7b subset + the Claude install-surface render
      # (.claude-plugin/plugin.json + marketplace.json must equal the inventory render) + the
      # host-package verifier. Any hand-edit to .claude-plugin metadata that diverges from
      # guild.inventory.v1 now FAILS CI: the install surface is generated, not hand-maintained.
      - name: Install-channel gate (G7 flip) — generated tree is the authoritative install surface
        run: |
          cd scripts && npm run verify:host-packages

      # Roster-vs-definitions drift gate — previously written but never wired into CI, so
      # .guild/wiki/entities/specialist-roster.md could silently diverge from agents/*.md and
      # templates/specialists/*.md `model:` frontmatter (MODEL_MISMATCH / MISSING_FILE /
      # NOT_IN_ROSTER) with nothing catching it. Read-only, no network, plugin-repo-local.
      - name: Roster consistency gate (specialist-roster.md vs agents/ + templates/specialists/)
        run: |
          npx tsx scripts/check-roster-consistency.ts

      # Host-support matrix drift gate — validates the committed host-smoke receipts and proves
      # docs/generated/host-support-matrix.md matches a fresh render, preventing silent doc drift.
      - name: Host-support matrix drift gate (generated matrix must match committed file)
        run: |
          cd scripts && npm run check:host-support-matrix

      # Plugin-root fallback regression rail (issue #36 / G1) — forbids the two-level
      # ${GUILD_PLUGIN_ROOT:-${CLAUDE_PLUGIN_ROOT}} pattern (host-render-time only, expands
      # to a nonexistent path in the Bash tool's shell) from being reintroduced in any
      # command/skill resource doc. Fixed occurrences carry a terminal $HOME default.
      - name: Plugin-root fallback rail (no two-level GUILD_PLUGIN_ROOT/CLAUDE_PLUGIN_ROOT fallback)
        run: |
          npx tsx scripts/check-plugin-root-fallback.ts

      # Bundle-determinism rail (issue #75) — the committed hook bundles must be a pure
      # function of hooks/ sources + hooks/package-lock.json. Two entrypoints bundle
      # first-party TypeScript from ../scripts/**, whose bare `import … from "js-yaml"`
      # esbuild resolves from the IMPORTER's directory — so the bundled js-yaml came from
      # plugin/scripts/node_modules (4.1.1) when that sibling package happened to be
      # installed and from plugin/hooks/node_modules (4.3.0) via the old NODE_PATH
      # fallback when it did not. Same sources, different committed bytes. This rail
      # forbids any bundle from carrying a module resolved outside the hooks package, and
      # requires every esbuild invocation to pin each declared hooks runtime dependency.
      # Static + read-only; the byte-level rebuild-idempotence half is R-DIST above.
      - name: Bundle determinism rail (hook bundles resolve deps only from hooks/node_modules)
        run: |
          npx tsx scripts/check-bundle-determinism.ts

      # Entrypoint packaging gate (issue #55 defect class) — every `npx tsx`/`node` hooks/
      # entrypoint documented in a shipped SKILL.md or hook source must actually exist on
      # disk. Catches the exact failure mode of issue #55 (a documented CLI invocation
      # whose target file was never shipped, surfacing as ERR_MODULE_NOT_FOUND at runtime)
      # before it reaches a release.
      - name: Entrypoint packaging gate (documented hooks/ CLI entrypoints must exist)
        run: |
          npx tsx scripts/check-entrypoint-packaging.ts
