# doc-sync.yml — Stage A of the docs sync pipeline (workspace docs/maintainer-guide.md).
# PR job: advisory reminder when the user-facing surface changes (never blocks).
# Push job (next/main): sends `plugin-changed` to lookatitude/guild-workspace, whose
# reference-sync regenerates docs/reference/ from this repo's manifests.
# Trap: the dispatch needs the GUILD_SYNC_TOKEN secret. Without it the push job
# reports "blocked" in its summary and the workspace's daily schedule picks the
# change up instead; it does not fail plugin CI. Escape: `docs-sync: n/a <reason>`.

name: doc-sync (rollout-coupling advisory)

on:
  pull_request:
    # Only fire when the user-facing surface might be touched (keeps it quiet otherwise).
    paths:
      - "commands/**"
      - "command-src/**"
      - "skills/**"
      - "templates/specialists/**"
      - "src/domains/**"
      - "src/surfaces/graphs/**"
      - "docs/generated/host-support-matrix.md"
      - "guild.inventory.json"
  push:
    branches: [next, main]
    paths:
      - "commands/**"
      - "command-src/**"
      - "skills/**"
      - "templates/specialists/**"
      - "src/domains/**"
      - "src/surfaces/graphs/**"
      - "docs/generated/host-support-matrix.md"
      - "guild.inventory.json"

permissions:
  contents: read

jobs:
  signal-workspace:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch plugin-changed to guild-workspace
        env:
          TOKEN: ${{ secrets.GUILD_SYNC_TOKEN }}
        run: |
          if [ -z "${TOKEN:-}" ]; then
            echo "::warning::status: blocked. GUILD_SYNC_TOKEN not set; workspace reference-sync runs on its daily schedule"
            echo "status: **blocked** (no GUILD_SYNC_TOKEN). Manual: \`gh workflow run reference-sync -R lookatitude/guild-workspace\`" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          GH_TOKEN="$TOKEN" gh api repos/lookatitude/guild-workspace/dispatches -f event_type=plugin-changed \
            -F "client_payload[next_ref]=next" -F "client_payload[source_sha]=$GITHUB_SHA"
          echo "status: dispatched plugin-changed for $GITHUB_REF_NAME @ $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"

  doc-sync:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    # Advisory: this job must NEVER block a PR. continue-on-error guarantees that even an
    # infrastructure failure (npm registry outage, checkout hiccup) cannot turn the PR red.
    continue-on-error: true
    steps:
      - name: Checkout (full history for the PR range)
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Node 24
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Install scripts/ dependencies
        run: |
          if [ -f scripts/package.json ]; then
            cd scripts && npm ci --prefer-offline 2>/dev/null || npm install --prefer-offline
          fi

      - name: Doc-sync advisory (non-blocking)
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -uo pipefail
          # Three-dot for the diff (PR file changes vs merge-base). The tool internally
          # narrows the log range to two-dot for escape-token detection (Codex-CI MAJOR-1).
          RANGE="${BASE_SHA}...${HEAD_SHA}"
          echo "doc-sync PR range: $RANGE"
          # Plugin repo is the only checkout here; the reference lives in the umbrella
          # repo, so --root-repo=. finds no root-doc update by design. NO --strict → exit 0
          # on a flagged advisory. Capture the exit code so a genuine git failure (exit 2)
          # is surfaced as a ::warning:: rather than masquerading as a CLEAN result.
          set +e
          OUT="$(npx tsx scripts/workspace/check-doc-sync.ts \
            --plugin-repo=. --root-repo=. \
            --plugin-range="$RANGE" --root-range="$RANGE" 2>&1)"
          CODE=$?
          set -e
          echo "$OUT"
          if [ "$CODE" -eq 2 ]; then
            echo "::warning::doc-sync could not evaluate (git error, exit 2) — advisory not computed"
          fi
          # Render OUT as 4-space-indented lines (NOT a ``` fence) so a crafted filename
          # containing backticks cannot break out of the block in the step summary (MINOR-3).
          {
            echo "## doc-sync — rollout-coupling advisory"
            echo ""
            printf '%s\n' "$OUT" | sed 's/^/    /'
            echo ""
            if [ "$CODE" -eq 2 ]; then
              echo "> ⚠️ doc-sync could not evaluate (git error). Advisory not computed."
              echo ""
            fi
            echo "_After merge to \`next\`/\`main\`, the workspace \`reference-sync\` regenerates \`docs/reference/\` from this repo's manifests and opens a reference PR; the website then gets a docs-sync PR. If the change is genuinely doc-irrelevant, add \`docs-sync: n/a <reason>\` to a commit. Advisory only; guide: workspace \`docs/maintainer-guide.md\`._"
          } >> "$GITHUB_STEP_SUMMARY"
