# comms-format.yml — communication-format lint (U5b enforce mode)
#
# Runs the comms-format-lint core over the PR diff range.
# U5b discipline: the enforcing step FAILS the job on ≥1 in-scope violation.
# OD-4 scoping is preserved — only changed paths in the PR diff range are
# tested, so the existing committed corpus is never retro-failed.
#
# Two-step design:
#   (1) comms-format-enforce — the blocking gate; runs with --enforce and fails
#       the job on any finding. This step does NOT use continue-on-error.
#   (2) comms-format-summary — always runs (if: always()) to emit the advisory
#       GitHub Step Summary regardless of the gate result, so authors see details.
#
# Policy ref: docs/knowledge/decisions/communication-format-policy.md
# OD-4 discriminator: only changed paths in the PR diff range are in-scope.
# Pre-effective-date and grandfathered files are never flagged.
#
# Owner: tooling-engineer.
# Lint core: scripts/comms/comms-format-lint.ts (pure library, import-safe)
# CLI entry: scripts/comms/comms-format-lint.cli.ts (invoked here)

name: comms-format (enforce)

on:
  pull_request:
    # Fire on any PR — the OD-4 discriminator narrows scope internally.
    # No path filter here: a changed receipt anywhere in the repo is in-scope.
    branches: ["**"]

permissions:
  contents: read

jobs:
  comms-format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history for the PR diff range)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install scripts/ dependencies
        run: |
          if [ -f scripts/package.json ]; then
            cd scripts && npm ci --prefer-offline 2>/dev/null || npm install --prefer-offline
          fi

      - name: Resolve PR diff (changed paths)
        id: diff
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          # Three-dot for the diff (PR file changes vs merge-base).
          RANGE="${BASE_SHA}...${HEAD_SHA}"
          echo "comms-format PR range: $RANGE"
          # Resolve changed paths to absolute paths for the lint core.
          CHANGED="$(git diff --name-only "${BASE_SHA}...${HEAD_SHA}" | tr '\n' ',')"
          echo "changed=${CHANGED}" >> "$GITHUB_OUTPUT"
          echo "range=${RANGE}" >> "$GITHUB_OUTPUT"

      - name: comms-format lint — enforce gate (blocking, OD-4 diff-range scoped)
        id: enforce
        env:
          CHANGED_PATHS: ${{ steps.diff.outputs.changed }}
        run: |
          set -uo pipefail
          if [ -z "${CHANGED_PATHS:-}" ]; then
            echo "No changed paths detected — skipping enforce gate."
            exit 0
          fi

          # Resolve relative paths to absolute (from repo root = $GITHUB_WORKSPACE).
          ABS_PATHS=""
          IFS=',' read -ra FILES <<< "${CHANGED_PATHS%,}"
          for f in "${FILES[@]}"; do
            [ -n "$f" ] && ABS_PATHS="${ABS_PATHS}${GITHUB_WORKSPACE}/${f},"
          done
          ABS_PATHS="${ABS_PATHS%,}"

          # Run with --enforce: exits 1 on any finding, 0 if clean.
          # Findings are printed to stdout/stderr by the CLI.
          # This step is the gating step — no continue-on-error.
          npx tsx scripts/comms/comms-format-lint.cli.ts \
            --paths "${ABS_PATHS}" \
            --enforce

      - name: comms-format lint — advisory summary (always runs)
        if: always()
        env:
          CHANGED_PATHS: ${{ steps.diff.outputs.changed }}
          ENFORCE_OUTCOME: ${{ steps.enforce.outcome }}
        run: |
          set -uo pipefail
          if [ -z "${CHANGED_PATHS:-}" ]; then
            {
              echo "## comms-format — communication-format lint (enforce mode)"
              echo ""
              echo "_No changed paths detected — lint skipped._"
              echo ""
              echo "_U5b enforce mode: new/changed files in PR diff range are gated. OD-4 scoped — pre-effective-date and grandfathered files are exempt. Canon: \`docs/knowledge/decisions/communication-format-policy.md\`._"
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          ABS_PATHS=""
          IFS=',' read -ra FILES <<< "${CHANGED_PATHS%,}"
          for f in "${FILES[@]}"; do
            [ -n "$f" ] && ABS_PATHS="${ABS_PATHS}${GITHUB_WORKSPACE}/${f},"
          done
          ABS_PATHS="${ABS_PATHS%,}"

          # Capture output in warn mode (always exits 0) for the summary.
          set +e
          OUT="$(npx tsx scripts/comms/comms-format-lint.cli.ts \
            --paths "${ABS_PATHS}" 2>&1)"
          set -e

          # Emit GitHub annotations for each warning line.
          while IFS= read -r line; do
            if echo "$line" | grep -q '\[comms-format-lint\] WARN'; then
              echo "::warning::${line}"
            fi
          done <<< "$OUT"

          # Surface summary with enforce status.
          GATE_STATUS="PASS"
          [ "${ENFORCE_OUTCOME}" = "failure" ] && GATE_STATUS="FAIL"
          {
            echo "## comms-format — communication-format lint (enforce mode) — ${GATE_STATUS}"
            echo ""
            printf '%s\n' "$OUT" | sed 's/^/    /'
            echo ""
            echo "_U5b enforce mode: new/changed files in PR diff range are gated (blocking). OD-4 scoped — pre-effective-date and grandfathered files are exempt. Canon: \`docs/knowledge/decisions/communication-format-policy.md\`._"
          } >> "$GITHUB_STEP_SUMMARY"
