name: Publish stable release after next merges to main

# The reviewed release unit is the exact same-repository `next -> main` PR.
# After merge, CI re-runs the promotion gate, derives the bare stable tag from
# the reviewed beta manifest, tags that merge commit, and publishes the GitHub
# Release. It does not create a release branch or rewrite protected branches.

on:
  pull_request:
    types: [closed]
    branches: [main]

concurrency:
  group: stable-release
  cancel-in-progress: false

jobs:
  release:
    if: |
      github.event.pull_request.merged == true &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'next'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      attestations: read
    steps:
      - name: Checkout the reviewed merge commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24"

      - name: Install scripts dependencies
        run: npm --prefix scripts ci --prefer-offline

      - name: Fetch protected channels and release tags
        env:
          MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          git fetch origin main next --tags --force
          test "$(git rev-parse "$MERGE_SHA^{tree}")" = "$(git rev-parse "$PR_HEAD_SHA^{tree}")"
          git merge-base --is-ancestor "$MERGE_SHA" origin/main

      - name: Verify the v2.7.0 GitHub OIDC provenance attestation
        env:
          GH_TOKEN: ${{ github.token }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./.claude-plugin/plugin.json').version")"
          if [[ "$VERSION" == 2.7.0-beta.* ]]; then
            gh attestation verify .guild/artifacts/release/v2.7.0/release-basis.json \
              --repo "$GITHUB_REPOSITORY" \
              --cert-identity "https://github.com/$GITHUB_REPOSITORY/.github/workflows/release-evidence-attestation.yml@refs/heads/next" \
              --source-ref refs/heads/next \
              --source-digest "$PR_HEAD_SHA" \
              --deny-self-hosted-runners
          fi

      - name: Re-verify hash-bound promotion evidence
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          MERGE_HEAD: ${{ github.event.pull_request.merge_commit_sha }}
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain)"
          npm --prefix scripts run check:channel-integrity -- promotion \
            --source-branch next \
            --head "$MERGE_HEAD" \
            --stable-ref "$BASE_SHA" \
            --root ..

      - name: Derive stable identity from the reviewed beta manifest
        id: version
        run: |
          set -euo pipefail
          npm --prefix scripts run finalize:stable-release -- inspect \
            --root .. \
            --github-output "$GITHUB_OUTPUT"

      - name: Check tag and release independently for idempotent re-runs
        id: existing
        env:
          GH_TOKEN: ${{ github.token }}
          MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          if git rev-parse --verify --quiet "refs/tags/$TAG^{commit}" >/dev/null; then
            TAG_SHA="$(git rev-parse "refs/tags/$TAG^{commit}")"
            if [ "$TAG_SHA" != "$MERGE_SHA" ]; then
              echo "::error::Immutable $TAG points to $TAG_SHA, expected reviewed merge $MERGE_SHA."
              exit 1
            fi
            echo "tag_exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "tag_exists=false" >> "$GITHUB_OUTPUT"
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "release_exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "release_exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Tag the reviewed merge commit
        if: steps.existing.outputs.tag_exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          TAG_OBJECT_SHA="$(gh api --method POST "repos/${GITHUB_REPOSITORY}/git/tags" \
            -f tag="$TAG" \
            -f message="$PR_TITLE" \
            -f object="$MERGE_SHA" \
            -f type=commit \
            --jq .sha)"
          gh api --method POST "repos/${GITHUB_REPOSITORY}/git/refs" \
            -f ref="refs/tags/$TAG" \
            -f sha="$TAG_OBJECT_SHA" >/dev/null

      - name: Verify published channel state
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          git fetch origin main next "refs/tags/$TAG:refs/tags/$TAG" --force
          npm --prefix scripts run check:channel-integrity -- \
            --stable origin/main \
            --beta origin/next

      - name: Decide whether this version may become Latest
        if: steps.existing.outputs.release_exists == 'false'
        id: release-order
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.stable_version }}
        run: |
          set -euo pipefail
          CURRENT_TAG="$(gh release view --json tagName --jq .tagName)"
          npm --prefix scripts run finalize:stable-release -- latest \
            --root .. \
            --candidate-version "$VERSION" \
            --current-tag "$CURRENT_TAG" \
            --github-output "$GITHUB_OUTPUT"

      - name: Create the GitHub Release if it is missing
        if: steps.existing.outputs.release_exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          set -euo pipefail
          BODY_FILE="$(mktemp)"
          trap 'rm -f "$BODY_FILE"' EXIT
          printf '%s' "$PR_BODY" > "$BODY_FILE"
          if ! grep -q "Full Changelog" "$BODY_FILE"; then
            PREV_TAG="$(git describe --tags --abbrev=0 --match 'v*' "$TAG^" 2>/dev/null || true)"
            if [ -n "$PREV_TAG" ]; then
              printf '\n\n**Full Changelog**: https://github.com/%s/compare/%s...%s\n' \
                "${{ github.repository }}" "$PREV_TAG" "$TAG" >> "$BODY_FILE"
            fi
          fi
          if [ "${{ steps.release-order.outputs.latest }}" = "true" ]; then
            gh release create "$TAG" --title "$PR_TITLE" --notes-file "$BODY_FILE" --latest
          else
            gh release create "$TAG" --title "$PR_TITLE" --notes-file "$BODY_FILE" --latest=false
          fi
