name: Finalize stable release after next merges to main

# The reviewed release unit is the exact same-repository `next -> main` PR.
# After merge, this protected job re-runs the promotion gate, creates one
# metadata-only stable commit, advances both channels to it atomically, tags
# that commit, and publishes the GitHub Release. No release branch is used.

on:
  pull_request:
    types: [closed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: stable-release
  cancel-in-progress: false

jobs:
  release:
    if: |
      github.event.pull_request.merged == true &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'next'
    runs-on: ubuntu-latest
    environment: stable-release
    steps:
      # GITHUB_TOKEN remains read-only. This environment-scoped App token is
      # repository-scoped, short-lived, and requests only contents:write plus
      # pull-requests:read for deterministic changelog lookups.
      - name: Mint repository-scoped release App token
        id: release-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: read

      - name: Checkout main at the reviewed merge commit
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          fetch-depth: 0
          token: ${{ steps.release-token.outputs.token }}

      - name: Set up Node 24
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Install scripts dependencies
        run: npm --prefix scripts ci --prefer-offline

      - name: Fetch both protected channels and release tags
        env:
          MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          git fetch origin main next --tags --force
          test "$(git rev-parse "$MERGE_SHA^{tree}")" = "$(git rev-parse "$PR_HEAD_SHA^{tree}")"

      - name: Re-verify hash-bound promotion evidence
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          MERGE_HEAD: ${{ github.event.pull_request.merge_commit_sha }}
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain)"
          npm --prefix scripts run check:channel-integrity -- promotion \
            --source-branch next \
            --head "$MERGE_HEAD" \
            --stable-ref "$BASE_SHA" \
            --root ..

      - name: Derive stable identity from the reviewed beta manifest
        id: version
        run: |
          set -euo pipefail
          npm --prefix scripts run finalize:stable-release -- inspect \
            --root .. \
            --github-output "$GITHUB_OUTPUT"

      - name: Check tag and release independently for idempotent re-runs
        id: existing
        env:
          GH_TOKEN: ${{ steps.release-token.outputs.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          if git rev-parse --verify --quiet "refs/tags/$TAG^{commit}" >/dev/null; then
            echo "tag_exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "tag_exists=false" >> "$GITHUB_OUTPUT"
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "release_exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "release_exists=false" >> "$GITHUB_OUTPUT"
          fi

      # On the first execution, next must still be the exact reviewed head.
      # After the atomic release push it intentionally points at the stable
      # release commit, so re-runs skip this fresh-promotion freeze check and
      # validate the existing tag/channel state instead.
      - name: Require the reviewed next head to remain frozen
        if: steps.existing.outputs.tag_exists == 'false'
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: test "$(git rev-parse origin/next)" = "$PR_HEAD_SHA"

      - name: Validate an existing finalized release before resuming
        if: steps.existing.outputs.tag_exists == 'true'
        env:
          MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.stable_version }}
        run: |
          set -euo pipefail
          RELEASE_SHA="$(git rev-parse "refs/tags/$TAG^{commit}")"
          MAIN_SHA="$(git rev-parse origin/main)"
          NEXT_SHA="$(git rev-parse origin/next)"
          test "$RELEASE_SHA" = "$MAIN_SHA"
          git merge-base --is-ancestor "$RELEASE_SHA" "$NEXT_SHA"
          git merge-base --is-ancestor "$MERGE_SHA" "$RELEASE_SHA"
          git checkout --detach "$RELEASE_SHA"
          npm --prefix scripts run finalize:stable-release -- verify \
            --root .. \
            --expected-version "$VERSION" \
            --base "$MERGE_SHA" \
            --head "$RELEASE_SHA"
          test -z "$(git status --porcelain)"

      - name: Prepare stable metadata from the beta manifest
        if: steps.existing.outputs.tag_exists == 'false'
        run: npm --prefix scripts run finalize:stable-release -- prepare --root ..

      - name: Generate the stable changelog section
        if: steps.existing.outputs.tag_exists == 'false'
        env:
          GH_TOKEN: ${{ steps.release-token.outputs.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: npm --prefix scripts run release:changelog -- --version "$TAG" --write

      - name: Regenerate every tracked version-bearing surface
        if: steps.existing.outputs.tag_exists == 'false'
        run: npm --prefix scripts run sync:claude-install -- --root ..

      - name: Create and verify the metadata-only stable commit
        if: steps.existing.outputs.tag_exists == 'false'
        env:
          APP_SLUG: ${{ steps.release-token.outputs.app-slug }}
          MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.stable_version }}
        run: |
          set -euo pipefail
          npm --prefix scripts run check:claude-install -- --root ..
          npm --prefix scripts run check:inventory -- --root ..
          git config user.name "${APP_SLUG}[bot]"
          git config user.email "${APP_SLUG}[bot]@users.noreply.github.com"
          git add -- \
            .claude-plugin/plugin.json \
            .claude-plugin/marketplace.json \
            .codex-plugin/plugin.json \
            .guild-native-claude-package-identity.json \
            CHANGELOG.md \
            guild.inventory.json
          git commit -m "chore(release): finalize $TAG"
          RELEASE_SHA="$(git rev-parse HEAD)"
          if ! git merge-base --is-ancestor "$PR_HEAD_SHA" "$RELEASE_SHA"; then
            RELEASE_TREE="$(git rev-parse "$RELEASE_SHA^{tree}")"
            RELEASE_SHA="$(printf '%s\n' "chore(release): preserve next ancestry for $TAG" | \
              git commit-tree "$RELEASE_TREE" -p "$RELEASE_SHA" -p "$PR_HEAD_SHA")"
            git checkout --detach "$RELEASE_SHA"
          fi
          npm --prefix scripts run finalize:stable-release -- verify \
            --root .. \
            --expected-version "$VERSION" \
            --base "$MERGE_SHA" \
            --head "$RELEASE_SHA"
          test -z "$(git status --porcelain)"

      - name: Atomically advance main and next and push the stable tag
        if: steps.existing.outputs.tag_exists == 'false'
        env:
          TAG: ${{ steps.version.outputs.tag }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          set -euo pipefail
          RELEASE_SHA="$(git rev-parse HEAD)"
          git tag -a "$TAG" "$RELEASE_SHA" -m "$PR_TITLE"
          git push --atomic origin \
            "$RELEASE_SHA:refs/heads/main" \
            "$RELEASE_SHA:refs/heads/next" \
            "refs/tags/$TAG"

      - name: Decide whether this version may become Latest
        if: steps.existing.outputs.release_exists == 'false'
        id: release-order
        env:
          GH_TOKEN: ${{ steps.release-token.outputs.token }}
          VERSION: ${{ steps.version.outputs.stable_version }}
        run: |
          set -euo pipefail
          # This repository already has stable releases. Fail closed on an API
          # error rather than treating network/auth failure as "no releases"
          # and accidentally allowing an older line to become Latest.
          CURRENT_TAG="$(gh release view --json tagName --jq .tagName)"
          npm --prefix scripts run finalize:stable-release -- latest \
            --root .. \
            --candidate-version "$VERSION" \
            --current-tag "$CURRENT_TAG" \
            --github-output "$GITHUB_OUTPUT"

      - name: Create the GitHub Release if it is missing
        if: steps.existing.outputs.release_exists == 'false'
        env:
          GH_TOKEN: ${{ steps.release-token.outputs.token }}
          TAG: ${{ steps.version.outputs.tag }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          set -euo pipefail
          BODY_FILE="$(mktemp)"
          trap 'rm -f "$BODY_FILE"' EXIT
          printf '%s' "$PR_BODY" > "$BODY_FILE"
          if ! grep -q "Full Changelog" "$BODY_FILE"; then
            PREV_TAG="$(git describe --tags --abbrev=0 --match 'v*' "$TAG^" 2>/dev/null || true)"
            if [ -n "$PREV_TAG" ]; then
              printf '\n\n**Full Changelog**: https://github.com/%s/compare/%s...%s\n' \
                "${{ github.repository }}" "$PREV_TAG" "$TAG" >> "$BODY_FILE"
            fi
          fi
          if [ "${{ steps.release-order.outputs.latest }}" = "true" ]; then
            gh release create "$TAG" --title "$PR_TITLE" --notes-file "$BODY_FILE" --latest
          else
            gh release create "$TAG" --title "$PR_TITLE" --notes-file "$BODY_FILE" --latest=false
          fi
