name: channel-integrity

# Mechanizes the release-discipline channel-convergence invariant.
# (initiative cross-host-release-distribution, work item xhrd-wi-06 / G6.)
#
# Branches ARE distribution channels: main = STABLE (default marketplace
# installs), next = BETA (`@next` followers). The short-path release tags the
# reviewed next -> main merge without rewriting either protected branch, so an
# exact shared beta candidate version is valid immediately after release.
# Any other state where beta serves OLDER code than stable remains invalid.
#
# That failure is invisible to every other gate: per-PR checks all stay green
# because nothing is wrong with any individual PR. It happened for real —
# v2.3.2 merged to main on 2026-07-25 and the then-manual sync-back never
# landed, leaving next at 2.3.1 with nothing reporting it. The current direct
# release path replaces that manual step, while this standing detector
# continues to report any stale or externally altered channel state.
#
# WHY THESE TRIGGERS:
#   push to main      — checks the reviewed release state immediately.
#   push to next      — checks ordinary beta advancement and the quiescent release point.
#   schedule (daily)  — catches the window between those two: a release that
#                       merged and was then left alone. Without this, a repo
#                       with no pushes stays silently broken.
#   workflow_dispatch — manual re-check after an operator fixes it.
#
# Pull requests to `next` validate GitHub's prospective merge commit so the
# same-commit quiescent exception cannot be satisfied by the head alone while
# the merge result would diverge. Push/schedule checks retain the standing
# channel-debt signal.

on:
  pull_request:
    types: [opened, reopened, synchronize, edited]
    branches: [next]
  push:
    branches: [main, next]
  schedule:
    # 07:00 UTC daily — a stale beta channel is a "notice within a day" problem,
    # not a "notice within a minute" one.
    - cron: "0 7 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  channel-integrity:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history — the gate reads both channel refs)
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Node 24
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Fetch both channel refs
        run: git fetch origin main next --quiet

      - name: Install scripts/ dependencies
        run: |
          if [ -f scripts/package.json ]; then
            cd scripts && npm ci --prefer-offline 2>/dev/null || npm install --prefer-offline
          fi

      # Exit 2 = beta trails stable. The script points operators to the release
      # workflow's idempotent recovery path rather than a manual sync-back.
      #
      # Run through `npm --prefix scripts` rather than a bare `npx tsx` at the repo
      # root: tsx is installed in scripts/node_modules by the step above, and a
      # root-level `npx` would not find it and would silently fetch another copy
      # from the network (slower, and unpinned relative to the lockfile).
      - name: Beta channel must not trail stable
        env:
          BETA_REF: ${{ github.event_name == 'pull_request' && github.sha || 'origin/next' }}
        run: npm --prefix scripts run check:channel-integrity -- --stable origin/main --beta "$BETA_REF" --json
