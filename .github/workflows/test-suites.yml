# test-suites.yml — the per-project dependency audits (blocking).
# `bun test` in compile-gates.yml is the test runner; Jest and ts-jest are gone (T16).

name: test suites

on:
  pull_request:
    branches: [next, main]
  push:
    branches: [next, main]

permissions:
  contents: read

concurrency:
  group: test-suites-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependency-audit:
    name: dependency audit (${{ matrix.project }})
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        project:
          - scripts
          - hooks
          - hooks/agent-team
          - tests
          - mcp-servers/guild-memory
          - mcp-servers/guild-telemetry
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node 24
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Audit production and development dependency graph
        working-directory: ${{ matrix.project }}
        run: |
          npm audit --package-lock-only --audit-level=high
          npm audit --package-lock-only --omit=dev --audit-level=high

