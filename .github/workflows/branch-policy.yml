name: branch-policy

# Enforces the next/main channel model (release-discipline rules 1-4):
#
#   main = STABLE channel. Marketplace installs track it (default branch), so
#          every merge to main ships to stable users immediately. Therefore
#          main only receives a same-repository PR from exact `next`.
#          release.yml then creates stable metadata, tags, and publishes.
#   next = BETA / integration channel. ALL feature/fix PRs target next
#          (`gh pr create --base next`). Beta users follow it via
#          `claude plugin marketplace add lookatitude/guild@next`.
#
# This gate is the deterministic backstop for that rule: a PR whose base is
# main fails unless its head is exact `next` in this repository. Prose alone does not
# enforce process — CI does.

on:
  pull_request:
    types: [opened, reopened, synchronize, edited, labeled, unlabeled]
    branches: [main]

permissions:
  contents: read

jobs:
  branch-policy:
    # FIC-93/B3: `branch-policy` is the ONLY status context live GitHub branch
    # protection requires, so publication is policy-bound to THIS job. Binding:
    # it needs promotion-evidence, and `if: always()` forces it to RUN (never
    # skip — GitHub treats a skipped required check as satisfied) so the guard
    # step below can FAIL the required context whenever the promotion gate did
    # not succeed. No GitHub setting changes; the dependency is workflow-local.
    needs: promotion-evidence
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require the hash-bound promotion-evidence job to have succeeded
        env:
          PROMOTION_RESULT: ${{ needs.promotion-evidence.result }}
        run: |
          set -euo pipefail
          if [ "$PROMOTION_RESULT" != "success" ]; then
            echo "::error::promotion-evidence concluded '$PROMOTION_RESULT' — the required branch-policy context fails: a release PR may not publish without the hash-bound stable-promotion gate." >&2
            exit 1
          fi
          echo "OK: promotion-evidence succeeded."
      - name: PRs into main must come from the same-repo next branch
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
        run: |
          set -euo pipefail
          if [ "$HEAD_REPO" != "${{ github.repository }}" ]; then
            echo "::error::PR into main from fork '$HEAD_REPO' — stable promotion must come from next in ${{ github.repository }}." >&2
            exit 1
          fi
          if [ "$HEAD_REF" != "next" ]; then
            echo "::error::PR into main from '$HEAD_REF' violates the channel model." >&2
            echo "main is stable and only accepts the reviewed integration branch: next -> main." >&2
            echo "Retarget this PR to next. When next is ready, open the release PR from next to main." >&2
            exit 1
          fi
          echo "OK: same-repository next -> main stable promotion."

  # FIC-91 / REL-P0 (FIC-74 §0/B1): the hash-bound stable-promotion gate. A
  # release PR may not publish without verifiable conformance evidence: the
  # promotion mode validates the guild.release_promotion.v1 record, the EXACT
  # bytes of its guild.release_conformance.v1 evidence (SHA-256-bound), re-runs
  # the production conformance evaluator over the transported inputs, binds the
  # evidence source commit, requires its ancestry, and enforces the exact
  # allowed diff. It runs against GitHub's prospective merge commit (the
  # default pull_request checkout) with full history for ancestry + diff.
  promotion-evidence:
    name: Require hash-bound stable-promotion evidence
    runs-on: ubuntu-latest
    steps:
      - name: Checkout prospective merge with full history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"
      # npm ci ONLY — a lockfile that cannot reproduce exactly must fail this
      # release gate, never silently degrade to npm install.
      - name: Install script dependencies
        working-directory: scripts
        run: npm ci --prefer-offline
      - name: Fetch the current stable channel for monotonic-version comparison
        run: git fetch origin main --quiet
      # `next` itself remains internally generated-consistent before promotion.
      - name: Enforce the generated-manifest invariant (check:claude-install)
        working-directory: scripts
        run: npm run check:claude-install -- --root ..
      - name: Require hash-bound stable-promotion evidence
        working-directory: scripts
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: npm run check:channel-integrity -- promotion --source-branch "$HEAD_REF" --head HEAD --stable-ref origin/main --root ..
