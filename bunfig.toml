# bunfig.toml — Bun is the AUTHOR plane (P1) and the CI compile plane (P2).
# It is never on a user's PATH (KTD10): users run plain `node` on the committed
# outputs under runtime/ and hooks/dist/.

[install]
# No package registry writes from the author plane; every dependency is pinned in
# the per-directory package-lock.json files the compile resolves from.
frozenLockfile = true

[test]
# Tests are colocated (src/, scripts/, hooks/, mcp-servers/, tests/); Bun takes ONE
# root, so the ignores carve out what is not a suite.
# TRAP: fixture trees hold test-shaped files and a main checkout carries
# .worktrees/<branch>/ copies; drop an ignore and the run double-counts.
# TRAP: always `bun test --isolate` (package.json, CI). Plain `bun test` shares one
# global and module registry across files, and bunfig has no key for isolation.
root = "."
preload = ["./test-preload.ts"]
pathIgnorePatterns = ["**/node_modules/**", "dist/**", "**/fixtures/**", ".worktrees/**"]
