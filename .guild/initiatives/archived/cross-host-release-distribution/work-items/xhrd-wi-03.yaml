  - "the remote switch applies to FETCHED stable/beta installs only; install.sh:428 deliberately treats a checkout working tree as the source and the development install path must keep working — proven with a checkout-path regression"
  - "pi (`git:`/`npm:` sources) and antigravity (`plugin@marketplace`) are evaluated for the same switch; adopt or record why not"
  - "a versioned per-host GitHub Release artifact is OPTIONAL and justified per host — it is NOT forced by the evidence and is only warranted for genuinely file-surface hosts (agents-file/kiro/qoder/trae)"
  - "any publish credential is a repo secret: never inlined in the workflow, never written to a receipt, never echoed to a log; security-auditor reviews any publish leg before merge (xhrd-def-constraint-3)"
  - "dist/ stays gitignored (xhrd-def-nongoal-2); release.yml stays idempotent on re-run"
  - "codex adversarial review RAN; PR to next"
evidence_refs:
