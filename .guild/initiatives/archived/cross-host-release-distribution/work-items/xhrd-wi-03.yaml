acceptance:
  - "per goals.md §G3 (REVISED after xhrd-wi-01) — install.sh + README register Codex against the repo's git marketplace (`codex plugin marketplace add lookatitude/guild --ref <main|next>`), not `$RENDERED_DIST/codex-marketplace`"
  - "SCOPE CORRECTION: no new Codex publish infrastructure is built — xhrd-wi-01 verified the repo ALREADY works as a git Codex marketplace (--ref main installs 2.3.2 today). The refuted thesis 'Codex cannot install from git, attach a release artifact' must NOT be implemented"
